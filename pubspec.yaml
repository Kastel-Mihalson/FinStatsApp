name: fin_stats_app
description: Шаблон Flutter-приложения для Android и iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # State Management & DI
  provider: ^6.1.0
  get_it: ^7.6.0

  # Models & Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.0

  # Settings storage
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

# shared_preferences_android 2.5.0 падает на части Android-устройств
# (NoSuchMethodError, данные не сохраняются). Закреплена проверенная версия.
# Если добавляете другие плагины, закрепляйте их версии так же:
# файла pubspec.lock в репозитории нет, и сборка берёт самые свежие версии.
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
