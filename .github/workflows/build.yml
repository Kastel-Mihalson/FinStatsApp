name: Build apps

# Запускается при каждом push в main и вручную (Actions → Build apps → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Эти три значения меняет скрипт new_app.py (или вы вручную).
# PROJECT_NAME должен совпадать с name в pubspec.yaml.
env:
  APP_NAME: Финансовая статистика
  PROJECT_NAME: fin_stats_app
  ORG: comido.app

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # В репозитории лежит только код приложения.
      # Папки android/ и ios/ создаются автоматически, если их ещё нет.
      - name: Generate platform folders
        run: flutter create . --platforms=android,ios --org "${{ env.ORG }}" --project-name "${{ env.PROJECT_NAME }}"

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="${{ env.APP_NAME }}"/' android/app/src/main/AndroidManifest.xml

      # Чёрный экран при старте на части Android-устройств связан с графическим
      # движком Impeller. Отключаем его, простому приложению он не нужен.
      - name: Disable Impeller on Android
        run: sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      # Постоянный ключ подписи: так новая сборка ставится ПОВЕРХ старой,
      # и данные приложения не удаляются. Ключ хранится не в репозитории,
      # а в секрете GitHub ANDROID_KEYSTORE_BASE64
      # (Settings → Secrets and variables → Actions → New repository secret).
      - name: Use fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Постоянный ключ подписи подключён"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан: APK подписан временным ключом и не встанет поверх старой версии."
          fi

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS (без подписи)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create . --platforms=android,ios --org "${{ env.ORG }}" --project-name "${{ env.PROJECT_NAME }}"

      - name: Set app name
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${{ env.APP_NAME }}" ios/Runner/Info.plist

      # Если приложению нужна камера или галерея (плагин image_picker),
      # раскомментируйте строки ниже, иначе iOS закроет приложение.
      # - name: Add camera and photo library permissions
      #   run: |
      #     /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Камера нужна для фото" ios/Runner/Info.plist || true
      #     /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Галерея нужна для выбора фото" ios/Runner/Info.plist || true

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "$PROJECT_NAME-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-ios-unsigned
          path: ${{ env.PROJECT_NAME }}-unsigned.ipa
